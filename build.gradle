plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}
version = '1.0.0'
group = 'dev.holdattack'
base { archivesName = 'holdattack-forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
}
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.6' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(ProcessResources).configureEach { filteringCharset = 'UTF-8' }
tasks.named('jar', Jar).configure {
    from('LICENSE')
    manifest { attributes 'Implementation-Version': project.version }
    finalizedBy 'reobfJar'
}
tasks.register('policyTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.holdattack.AttackPolicyTest'
}
tasks.named('check').configure { dependsOn 'policyTest' }
